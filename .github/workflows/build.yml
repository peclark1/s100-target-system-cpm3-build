name: Build CP/M 3 FDC+3712 candidate

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reproduce CPM3.SYS
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            make
          else
            ALLOW_CHANGED_SYS=1 make
          fi

      - name: Build candidate CF image
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            make image
          else
            ALLOW_CHANGED_SYS=1 make image
          fi

      - name: Publish hardware-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpm3-fdc3712-candidate
          path: |
            dist/CPM3.SYS
            dist/BIOS3.SPR
            dist/BIOS3.SYM
            dist/S100-cpm3-nonbanked-prop-dualcf-fdc3712-candidate.img
